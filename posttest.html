<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>模擬課程課後問卷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 海報式漫畫風——放射光芒底色上，一張張粗黑框「貼紙卡」由上而下疊放；選課卡 → 題組卡 → 送出 */
:root{
  --ground:#0F4D36;--ground-deep:#0B3F2C;--paper:#F4FAF3;--soft:#DCF0E2;--accent:#14805A;--accent-text:#0F6646;--muted:#4D6157;
  --ink:#1B1410;
  --white:#FFFFFF;
  --pop:#FFD84D;
  --danger:#C62828;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:18px;
  --shadow:5px 5px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--ground)}
body{
  margin:0;font-family:var(--f-body);color:var(--ink);font-size:16px;line-height:1.6;
  background:
    radial-gradient(circle at 50% -10%, rgba(255,255,255,.22), transparent 55%),
    repeating-conic-gradient(from 0deg at 50% -8%, var(--ground) 0deg 6deg, var(--ground-deep) 6deg 12deg);
  background-color:var(--ground);
  min-height:100vh;
  padding-inline:16px;padding-block:20px 56px;
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* ---------- Hero ---------- */
.hero{position:relative;text-align:center;padding-block:8px 4px}
.bubble{
  display:inline-block;background:var(--white);border:3px solid var(--ink);border-radius:14px;
  padding:6px 14px;font-weight:900;font-size:15px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg);
  position:relative;margin-bottom:10px
}
.bubble::after{content:"";position:absolute;left:28px;bottom:-12px;width:16px;height:16px;background:var(--white);
  border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) skew(10deg,10deg)}
.h-title{margin:0;font-family:var(--f-display);font-weight:900;line-height:1.08;letter-spacing:.02em;text-wrap:balance}
.h-title .l1,.h-title .l2{display:block;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:5px 6px 0 var(--ink)}
.h-title .l1{color:var(--white);font-size:clamp(34px,8vw,58px)}
.h-title .l2{color:var(--pop);font-size:clamp(40px,10vw,72px)}
.en{display:inline-block;margin-top:14px;background:var(--white);border:3px solid var(--ink);border-radius:999px;
  padding:4px 16px;font-weight:700;font-size:13px;letter-spacing:.06em;box-shadow:3px 3px 0 var(--ink)}
.burst{
  position:absolute;right:-6px;top:-4px;width:96px;height:96px;display:grid;place-items:center;text-align:center;
  font-weight:900;line-height:1.1;font-size:14px;color:var(--ink);transform:rotate(10deg);
}
.burst::before{content:"";position:absolute;inset:0;background:var(--pop);border:3px solid var(--ink);
  clip-path:polygon(50% 0,61% 18%,82% 8%,80% 30%,100% 36%,86% 52%,100% 68%,79% 72%,82% 93%,61% 83%,50% 100%,39% 83%,18% 93%,21% 72%,0 68%,14% 52%,0 36%,20% 30%,18% 8%,39% 18%)}
.burst span{position:relative}
.burst b{display:block;font-size:24px}
@media (max-width:560px){.burst{width:76px;height:76px;font-size:11px;right:-8px;top:-14px}.burst b{font-size:18px}}

/* ---------- Cards ---------- */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 20px 20px;position:relative}
.tab{
  position:absolute;top:-18px;left:16px;display:flex;align-items:center;gap:8px;
  background:var(--ink);color:var(--white);border-radius:10px;padding:4px 14px 5px;font-weight:900;font-size:17px;letter-spacing:.04em
}
.tab .no{background:var(--accent);color:var(--white);border-radius:6px;padding:0 7px;font-size:14px;border:2px solid var(--white)}
.intro{font-size:14px;color:var(--muted);margin:6px 0 0}

/* course picker */
.courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
@media (max-width:560px){.courses{grid-template-columns:1fr}}
.course{
  all:unset;min-height:64px;justify-content:center;padding-right:84px!important;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;
  background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:12px 14px 12px;position:relative;
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;box-shadow:3px 3px 0 var(--ink)
}
.course:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.course:focus-visible{outline:3px solid var(--pop);outline-offset:3px}
.course[aria-pressed="true"]{background:var(--pop);transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.c-top{display:flex;align-items:center;gap:10px}
.c-no{font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--white);background:var(--accent);
  border:3px solid var(--ink);border-radius:9px;padding:0 8px;line-height:1.35;flex:none}
.c-name{font-weight:900;font-size:18px;line-height:1.3;min-width:0}
.c-meta{font-size:13px;color:var(--muted);line-height:1.5;display:grid;gap:1px}
.c-meta b{color:var(--ink);font-weight:700}
.c-target{position:absolute;right:10px;top:-12px;background:var(--ink);color:var(--pop);font-weight:900;font-size:12px;
  border-radius:999px;padding:1px 10px;letter-spacing:.05em}
.c-check{position:absolute;right:12px;top:50%;margin-top:-10px;font-weight:900;font-size:13px;opacity:0}
.course[aria-pressed="true"] .c-check{opacity:1}

/* ---------- Questions ---------- */
.qs{display:flex;flex-direction:column;gap:22px;margin-top:10px}
.q{display:flex;flex-direction:column;gap:10px;scroll-margin-top:70px}
.q-label{font-weight:700;font-size:16.5px;line-height:1.5;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.q-num{flex:none;display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:50%;
  background:var(--ink);color:var(--white);font-weight:900;font-size:14px;margin-top:-1px}
.q-text{flex:1 1 200px;min-width:0}
.q-tag{flex:none;font-size:12px;font-weight:700;color:var(--accent-text);background:var(--soft);border:2px solid var(--accent);
  border-radius:999px;padding:0 9px;line-height:1.7}
.q-hint{font-size:13px;color:var(--muted);margin:-4px 0 0 36px}
.q.missing .q-label .q-text{color:var(--danger)}
.q .err{display:none;color:var(--danger);font-size:13px;font-weight:700;margin-left:36px}
.q.missing .err{display:block}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding-left:36px}
@media (max-width:480px){.chips,.q-hint,.q .err,.likert,.textin{padding-left:0;margin-left:0}}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{
  display:inline-block;cursor:pointer;background:var(--white);border:2.5px solid var(--ink);border-radius:999px;
  padding:6px 14px;font-size:15px;font-weight:500;line-height:1.4;transition:background .1s, transform .1s
}
.chip span:hover{background:var(--soft)}
.chip input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.chip input:checked + span{background:var(--accent);color:var(--white);font-weight:700;box-shadow:2px 2px 0 var(--ink);transform:translate(-1px,-1px)}
.chip input:disabled + span{opacity:.4;cursor:not-allowed}
.other-in{margin-left:36px;margin-top:-2px}
@media (max-width:480px){.other-in{margin-left:0}}

.textin,.other-in{display:block}
input[type=text],textarea{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--white);border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;
}
textarea{min-height:96px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px var(--pop),3px 3px 0 var(--ink)}
.textin{padding-left:36px}

/* likert matrix */
.likert{padding-left:36px;display:flex;flex-direction:column;gap:10px}
.scale-key{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;padding:0 2px}
.lk-row{background:var(--white);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.lk-row.missing{border-color:var(--danger);box-shadow:0 0 0 2px var(--danger)}
.lk-item{font-weight:600;font-size:15px;line-height:1.45}
.lk-item i{font-style:normal;color:var(--accent-text);font-weight:900;margin-right:4px}
.lk-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lk-btns label{position:relative}
.lk-btns input{position:absolute;opacity:0;pointer-events:none}
.lk-btns span{display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  border:2px solid var(--ink);border-radius:10px;padding:5px 2px;background:var(--paper);line-height:1.15;text-align:center;min-height:48px}
.lk-btns span b{font-size:17px;font-weight:900}
.lk-btns span small{font-size:11px;color:var(--muted)}
.lk-btns input:checked + span{background:var(--accent);color:var(--white)}
.lk-btns input:checked + span small{color:var(--white)}
.lk-btns input:focus-visible + span{outline:3px solid var(--pop);outline-offset:1px}
@media (max-width:520px){.lk-btns span small{display:none}.lk-btns span{min-height:40px}}

/* ---------- progress + submit ---------- */
.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--white);border-radius:999px;
  padding:6px 8px 6px 16px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px;box-shadow:3px 3px 0 rgba(0,0,0,.25)}
.bar{flex:1;height:12px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pop);border-radius:999px;transition:width .25s ease}
.progress .pct{font-variant-numeric:tabular-nums;min-width:62px;text-align:right;padding-right:8px}

.submit-zone{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.btn{
  all:unset;box-sizing:border-box;cursor:pointer;font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.06em;
  background:var(--pop);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:12px 34px;box-shadow:5px 5px 0 var(--ink);
  transition:transform .1s, box-shadow .1s
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--white);outline-offset:3px}
.btn[disabled]{opacity:.6;cursor:wait}
.btn .arr{color:var(--accent-text);margin-left:6px}
.submit-note{color:var(--white);font-size:13px;font-weight:500;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.formerr{color:var(--white);background:var(--danger);border:3px solid var(--ink);border-radius:12px;padding:6px 14px;font-weight:700;font-size:14px}

/* ---------- done ---------- */
.done{text-align:center;padding:34px 20px 28px}
.done .big{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,8vw,52px);line-height:1.1;margin:6px 0 10px;
  color:var(--pop);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:4px 5px 0 var(--ink)}
.done p{margin:6px auto;max-width:34em}
.done .tagline{font-weight:900;font-size:18px}
.demo-flag{display:inline-block;margin-top:12px;font-size:12px;color:var(--muted);border:2px dashed var(--muted);border-radius:8px;padding:2px 10px}

.foot{text-align:center;color:var(--white);font-size:12.5px;opacity:.9;text-shadow:0 1px 0 rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <header class="hero">
    <div class="bubble">辛苦了！回顧一下今天的收穫</div>
    <h1 class="h-title"><span class="l1">臨床技能中心</span><span class="l2">後測＋滿意度</span></h1>
    <div class="en">Simulation Course · Post-Course Survey</div>
    <div class="burst" aria-hidden="true"><span>約<b>3</b>分鐘</span></div>
  </header>

  <section class="card" aria-labelledby="pick-h">
    <div class="tab" id="pick-h"><span class="no">STEP 1</span>選擇今天的課程</div>
    <p class="intro">點選你今天上完的課程，就會出現這堂課的後測與滿意度題目。請在課程結束後完成。</p>
    <div class="courses" id="courses"></div>
  </section>

  <div class="progress" id="progress" hidden><span>填答進度</span><div class="bar"><i id="barfill"></i></div><span class="pct" id="pct">0 / 0</span></div>

  <form id="form" novalidate hidden>
    <div class="wrap" id="sections" style="gap:30px"></div>
    <div class="submit-zone" style="margin-top:28px">
      <div class="formerr" id="formerr" hidden></div>
      <button class="btn" type="submit" id="submitBtn">送出問卷<span class="arr">›››</span></button>
      <div class="submit-note">本問卷採記名填寫，結果僅供課程改善及教學成效評估使用，不影響任何考核成績。</div>
    </div>
  </form>

  <section class="card done" id="done" hidden>
    <div class="tab"><span class="no">✓</span>已送出</div>
    <div class="big" id="doneBig"></div>
    <p class="tagline" id="doneLine"></p>
    <p id="doneSub"></p>
    <span class="demo-flag" id="demoFlag" hidden>示範模式：尚未連接 Google Sheet，資料未上傳</span>
  </section>

  <div class="foot">奇美醫院教學部臨床技能中心</div>
</div>

<script>

const PHASE = 'post';               // 'pre' | 'post'

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

function renderCourses() {
  $('#courses').innerHTML = DATA.courses.map((c, i) => `
    <button type="button" class="course" data-id="${c.id}" aria-pressed="false">
      <span class="c-top"><span class="c-no">${String(i + 1).padStart(2, '0')}</span><span class="c-name">${esc(c.name)}</span></span>
      <span class="c-check">✓ 已選擇</span>
    </button>`).join('');
  document.querySelectorAll('.course').forEach(b => b.addEventListener('click', () => pick(b.dataset.id, true)));

function pick(id, scroll) {
  const c = DATA.courses.find(x => x.id === id);
  if (!c) return;
  current = c;
  document.querySelectorAll('.course').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
  buildForm(c);
  $('#form').hidden = false; $('#progress').hidden = false; $('#done').hidden = true;
  if (scroll) setTimeout(() => $('#sections').scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
}

// ---------- render ----------
function buildForm(c) {
  const S = defs(c);
  questions = [];
  let n = 0;
  $('#sections').innerHTML = S.map((s, si) => `
    <section class="card">
      <div class="tab"><span class="no">${si === 0 ? esc(c.short) : 'PART ' + (si + 1)}</span>${esc(s.title)}</div>
      ${si === 0 ? `<p class="intro">${esc(c.name)}｜${PHASE === 'pre' ? '請於課程開始前填寫' : '請於課程結束後填寫'}</p>` : ''}
      <div class="qs">${s.qs.map(q => { n++; q.n = n; questions.push(q); return renderQ(q); }).join('')}</div>
    </section>`).join('');
  // restore remembered name / identity
  questions.filter(q => q.remember).forEach(q => {
    const v = store.get(q.remember); if (!v) return;
    const el = $(`#q-${q.n}`);
    if (q.t === 'text') $('input', el).value = v;
    else { const r = [...el.querySelectorAll('input')].find(i => i.value === v); if (r) r.checked = true; }
  });
  $('#sections').querySelectorAll('input,textarea').forEach(i => {
    i.addEventListener('input', onChange); i.addEventListener('change', onChange);
  });
  updateProgress();
}

function tagFor(q) {
  if (q.tag) return q.tag;
  if (!q.req) return '選填';
  return { radio: '單選', text: '必填', area: '簡答', check: '複選' }[q.t] || '';
}

function renderQ(q) {
  const id = `q-${q.n}`;
  const name = `f${q.n}`;
  let body = '';
  if (q.t === 'text') body = `<div class="textin"><input type="text" id="${id}-in" name="${name}" placeholder="${esc(q.ph || '')}" autocomplete="name"></div>`;
  if (q.t === 'area') body = `<div class="textin"><textarea id="${id}-in" name="${name}" placeholder="${esc(q.ph || '')}"></textarea></div>`;
  if (q.t === 'radio' || q.t === 'check') {
    const type = q.t === 'radio' ? 'radio' : 'checkbox';
    const opts = [...q.opts, ...(q.other ? ['其他'] : [])];
    body = `<div class="chips" role="${type === 'radio' ? 'radiogroup' : 'group'}" aria-labelledby="${id}-l">${opts.map((o, i) =>
      `<label class="chip"><input type="${type}" id="${id}-o${i}" name="${name}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`;
    if (q.other) body += `<div class="other-in" id="${id}-other" hidden><input type="text" id="${id}-oth" placeholder="請說明「其他」" aria-label="其他說明"></div>`;
    if (q.follow) body += `<div class="other-in" id="${id}-follow" hidden><input type="text" id="${id}-fol" placeholder="${esc(q.follow.ph)}" aria-label="${esc(q.follow.ph)}"></div>`;
  }
  if (q.t === 'likert') {
    body = `<div class="likert"><div class="scale-key"><span>1 ${esc(q.scale[0].replace(/^1\s*/, ''))}</span><span>5 ${esc(q.scale[4].replace(/^5\s*/, ''))}</span></div>` +
      q.items.map((it, r) => `<div class="lk-row" id="${id}-r${r}" role="radiogroup" aria-label="${esc(it)}">
        <div class="lk-item"><i>${String.fromCharCode(97 + r)}.</i>${esc(it)}</div>
        <div class="lk-btns">${q.scale.map((s, v) => {
          const lab = s.replace(/^\d\s*/, '');
          return `<label><input type="radio" id="${id}-r${r}-${v + 1}" name="${name}-r${r}" value="${v + 1}"><span><b>${v + 1}</b><small>${esc(lab)}</small></span></label>`;
        }).join('')}</div></div>`).join('') + `</div>`;
  }
  return `<div class="q" id="${id}" data-n="${q.n}">
    <div class="q-label" id="${id}-l"><span class="q-num">${q.n}</span><span class="q-text">${esc(q.label)}</span>${tagFor(q) ? `<span class="q-tag">${esc(tagFor(q))}</span>` : ''}</div>
    ${q.hint ? `<div class="q-hint">${esc(q.hint)}</div>` : ''}
    ${body}
    <div class="err">${q.t === 'likert' ? '還有項目尚未選擇喔' : '這題還沒填喔'}</div>
  </div>`;
}

// ---------- state ----------
function valueOf(q) {
  const el = $(`#q-${q.n}`);
  if (q.t === 'text' || q.t === 'area') return $(q.t === 'text' ? 'input' : 'textarea', el).value.trim();
  if (q.t === 'radio') {
    const r = el.querySelector('.chips input:checked'); if (!r) return '';
    if (r.value === '其他') { const t = $(`#q-${q.n}-oth`).value.trim(); return t ? `其他：${t}` : '其他'; }
    return r.value;
  }
  if (q.t === 'check') {
    return [...el.querySelectorAll('.chips input:checked')].map(i => {
      if (i.value === '其他') { const t = $(`#q-${q.n}-oth`).value.trim(); return t ? `其他：${t}` : '其他'; }
      return i.value;
    });
  }
  if (q.t === 'likert') return q.items.map((_, r) => { const i = el.querySelector(`input[name="f${q.n}-r${r}"]:checked`); return i ? Number(i.value) : null; });
}

function isDone(q) {
  const v = valueOf(q);
  if (!q.req) return true;
  if (q.t === 'likert') return v.every(x => x != null);
  if (q.t === 'check') return v.length > 0 && !v.includes('其他');
  if (q.t === 'radio') return v !== '' && v !== '其他';
  return v !== '';
}

function onChange(e) {
  const qEl = e.target.closest('.q'); if (!qEl) return;
  const q = questions.find(x => x.n === Number(qEl.dataset.n));
  if (q.t === 'check' && q.max) {
    const boxes = [...qEl.querySelectorAll('.chips input')];
    const n = boxes.filter(b => b.checked).length;
    boxes.forEach(b => { b.disabled = !b.checked && n >= q.max; });
  }
  if (q.other) {
    const on = !!qEl.querySelector('.chips input[value="其他"]:checked');
    $(`#q-${q.n}-other`).hidden = !on;
  }
  if (q.follow) {
    const on = !!qEl.querySelector(`.chips input[value="${q.follow.when}"]:checked`);
    $(`#q-${q.n}-follow`).hidden = !on;
  }
  if (qEl.classList.contains('missing') && isDone(q)) qEl.classList.remove('missing');
  if (q.t === 'likert') qEl.querySelectorAll('.lk-row.missing').forEach((row, i) => { if (row.querySelector('input:checked')) row.classList.remove('missing'); });
  updateProgress();
}

function updateProgress() {
  const req = questions.filter(q => q.req);
  const done = req.filter(isDone).length;
  $('#barfill').style.width = req.length ? `${(done / req.length) * 100}%` : '0';
  $('#pct').textContent = `${done} / ${req.length}`;
}

// ---------- submit ----------
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  $('#formerr').hidden = true;
  const missing = questions.filter(q => !isDone(q));
  questions.forEach(q => $(`#q-${q.n}`).classList.toggle('missing', missing.includes(q)));
  missing.filter(q => q.t === 'likert').forEach(q => {
    valueOf(q).forEach((v, r) => $(`#q-${q.n}-r${r}`).classList.toggle('missing', v == null));
  });
  if (missing.length) {
    $('#formerr').textContent = `還有 ${missing.length} 題沒完成（第 ${missing.map(q => q.n).join('、')} 題），補上就可以送出囉！`;
    $('#formerr').hidden = false;
    $(`#q-${missing[0].n}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  const row = { '時間戳記': new Date().toLocaleString('zh-TW', { hour12: false }), '問卷': PHASE_LABEL, '課程': current.name };
  questions.forEach(q => {
    const v = valueOf(q);
    if (q.t === 'likert') q.items.forEach((it, i) => { row[`${q.k}｜${it}`] = v[i]; });
    else if (q.t === 'check') row[q.k] = v.join('；');
    else row[q.k] = v;
    if (q.follow) row[q.follow.k] = v === q.follow.when ? $(`#q-${q.n}-fol`).value.trim() : '';
    if (q.remember) store.set(q.remember, v);
  });

  const btn = $('#submitBtn');
  btn.disabled = true; btn.firstChild.textContent = '送出中…';
  let demo = !SCRIPT_URL;
  try {
    if (!demo) {
      await fetch(SCRIPT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ sheet: `${current.short}_${PHASE_LABEL}`, row }),
      });
    } else {
      console.log('[示範模式] 未設定 SCRIPT_URL，以下為將送出的資料：', row);
    }
    showDone(row['姓名'], demo);
  } catch (err) {
    $('#formerr').textContent = '送出失敗，請確認網路連線後再按一次「送出問卷」。';
    $('#formerr').hidden = false;
  } finally {
    btn.disabled = false; btn.firstChild.textContent = '送出問卷';
  }
});

function showDone(name, demo) {
  $('#form').hidden = true; $('#progress').hidden = true;
  $('#doneBig').textContent = PHASE === 'pre' ? '前測完成！' : '感謝填答！';
  $('#doneLine').textContent = PHASE === 'pre'
    ? `${name}，準備好了！一起在模擬中變強吧！`
    : `${name}，今天辛苦啦！謝謝你的熱情參與！`;
  $('#doneSub').textContent = PHASE === 'pre'
    ? `已收到你的「${current.name}」課前問卷。課程結束後，記得再填一份後測問卷喔！`
    : `已收到你的「${current.name}」後測暨滿意度問卷。你的每一句回饋，都會讓下一堂課更好。`;
  $('#demoFlag').hidden = !demo;
  $('#done').hidden = false;
  $('#done').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ---------- boot ----------
renderCourses();
(() => {
  // 支援以 ?course=echo 或 #echo 直接帶入課程（可各課程各做一個 QR Code）
  let id = '';
  try { id = new URLSearchParams(location.search).get('course') || ''; } catch (e) {}
  if (!id && location.hash) id = location.hash.slice(1);
  if (id) pick(id, false);
})();
</script>
